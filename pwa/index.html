<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b5f">
<meta name="color-scheme" content="light dark">
<title>Glory Round</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glory Round">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="lightbox">
  <img id="lbImg" alt="">
  <div class="lb-bar">
    <button class="btn danger" data-act="lb-remove">Buang</button>
    <button class="btn" data-act="lb-close">Tutup</button>
  </div>
</dialog>

<div id="printArea"></div>
<input type="file" id="picker" accept="image/*" hidden>
<input type="file" id="camPicker" accept="image/*" capture="environment" hidden>
<dialog id="sigDlg">
  <b>Tandatangan penyedia</b>
  <canvas id="sigCv"></canvas>
  <div class="lb-row">
    <button class="btn ghost" data-act="sig-undo">Padam</button>
    <button class="btn ghost" data-act="sig-cancel">Batal</button>
    <button class="btn" data-act="sig-ok">Simpan</button>
  </div>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
